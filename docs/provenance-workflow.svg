<text x="60" y="762.0" font-family="Arial, sans-serif" font-size="17" fill="#1f2937">Conceptual source/workflow map, not execution evidence.</text>
<text x="60" y="783.25" font-family="Arial, sans-serif" font-size="17" fill="#1f2937">Documentation-only additions leave the inherited skill unchanged.</text>
<text x="60" y="804.5" font-family="Arial, sans-serif" font-size="17" fill="#1f2937">Edit the .excalidraw source; regenerate SVG with python3 docs/render-workflow.py.</text>
